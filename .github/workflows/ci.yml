name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: 测试(${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # 3.9 仍受代码支持，但 Ubuntu 26.04 runner 已无该版本，故 CI 用 3.10+
        python: ["3.10", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: 安装 xvfb(Ubuntu 上 GUI 测试需要虚拟显示)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: 安装项目(src 布局,必须先安装才能 import)
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: 运行单元测试(Linux 用 xvfb-run 提供虚拟显示)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m unittest discover -s tests -v
      - name: 运行单元测试(Windows / macOS)
        if: runner.os != 'Linux'
        run: python -m unittest discover -s tests -v
      - name: 冒烟测试(CLI)
        run: |
          python -m pytoolbox passgen --count 1 --json
          python -m pytoolbox --version
