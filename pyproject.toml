[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pytoolbox"
version = "1.0.0"
description = "一个仓库,四种用法:Python 库 / 命令行 / 网页版 / 桌面 GUI 的多功能工具箱(零第三方依赖)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "JAKE1266" }]
keywords = ["toolbox", "cli", "file-organizer", "dedupe", "password-generator", "tkinter", "gui"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Chinese (Simplified)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/JAKE1266/py-toolbox"
Issues = "https://github.com/JAKE1266/py-toolbox/issues"

[project.scripts]
pytoolbox = "pytoolbox.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pytoolbox = ["templates/*.html"]
